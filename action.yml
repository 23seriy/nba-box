name: "nba-box"
description: "🏀 Update a pinned gist to contain your favourite NBA team stats"
branding:
  icon: "award"
  color: "orange"
runs:
  # node24 is the newest JavaScript action runtime GitHub Actions supports; the bundled
  # runner Node is already 24 even though requests for node20 still work.
  using: "node24"
  main: "dist/index.js"
