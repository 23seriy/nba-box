name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      # Required so Dependabot PRs can push the rebuilt dist/ back to their branch.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Commit rebuilt dist for Dependabot PRs
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' || github.actor == '23seriy'
        run: |
          if git diff --quiet -- dist/; then
            echo "dist/ is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore(deps): rebuild dist bundle"
          git push
          echo "pushed=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Approve run queued for the rebuilt commit
        if: steps.rebuild.outputs.pushed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 12); do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=${{ steps.rebuild.outputs.pushed }}&event=pull_request" --jq '.workflow_runs[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve" && break
            fi
            sleep 5
          done
      - run: git diff --exit-code dist/
