name: Update NBA Gist
on:
  schedule:
    - cron: "0 0 * * *" # Every day at 00:00 UTC
  workflow_dispatch:
jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          # Latest Node 26 release, so setup-node does not need a pinned patch version.
          check-latest: true
      - name: Update gist
        run: node dist/index.js
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NBA_TEAM: ${{ secrets.NBA_TEAM }}
