name: Update NBA Gist
on:
  schedule:
    # Hourly, so results and live scores reach the gist within the hour. GitHub
    # delays scheduled runs most at the top of the hour, hence the non-zero minute.
    - cron: "17 * * * *"
    # The README preview only needs a daily refresh, so it does not add a commit
    # after every score change.
    - cron: "23 0 * * *"
  workflow_dispatch:
jobs:
  update-gist:
    runs-on: ubuntu-latest
    permissions:
      # Required to push the refreshed README preview branch and merge its PR.
      contents: write
      pull-requests: write
      # Required to dispatch the CI run and post its "lint" check on the preview PR.
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to commit the refreshed README preview back to main.
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          # Latest Node 26 release, so setup-node does not need a pinned patch version.
          check-latest: true
      - name: Update gist
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "23 0 * * *" ]; then
            args="--update-readme"
          fi
          node dist/index.js $args
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NBA_TEAM: ${{ secrets.NBA_TEAM }}
      - name: Commit refreshed README preview
        run: |
          echo "TEMPORARY validation nudge" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): refresh preview from the live gist"
          # main requires the "lint" status check, so pushing straight from a scheduled
          # run is rejected (GH006). Open a PR instead and queue auto-merge so GitHub
          # merges it as soon as the required checks pass. Requires the repo settings
          # "Read and write" workflow permissions and "Allow GitHub Actions to create
          # and approve pull requests".
          branch="docs/readme-preview-$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --head "$branch" --title "docs(readme): refresh preview from the live gist" \
            --body "Automated refresh of the README preview generated from the live gist."
          # A GITHUB_TOKEN commit never gets the required "lint" check attached to its
          # PR: the pull_request run is held for approval and only a human can rerun
          # it. A workflow_dispatch run on the same commit is not held, so start one
          # and use the Checks API to post "lint" for the PR's head SHA.
          gh workflow run ci.yml --ref "$branch"
          head_sha=$(git rev-parse HEAD)
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow=ci.yml --branch "$branch" --event workflow_dispatch \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo "CI run for $branch never appeared"; exit 1; }
          conclusion=""
          for _ in $(seq 1 180); do
            conclusion=$(gh run view "$run_id" --json status,conclusion --jq '.conclusion // empty')
            [ -n "$conclusion" ] && break
            sleep 10
          done
          [ -n "$conclusion" ] || conclusion="timed_out"
          conclusion="$conclusion" head_sha="$head_sha" python3 - <<'PY'
          import json, os, urllib.request

          conclusion = os.environ["conclusion"]
          head_sha = os.environ["head_sha"]
          summary = f"Dispatched CI run concluded: {conclusion}."

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "nba-box-readme-preview",
              },
              data=json.dumps({
                  "name": "lint",
                  "head_sha": head_sha,
                  "status": "completed",
                  "conclusion": conclusion,
                  "output": {"title": "lint", "summary": summary},
              }).encode(),
          )
          urllib.request.urlopen(request).read()
          PY
          gh pr merge "$branch" --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
