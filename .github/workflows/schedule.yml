name: Update NBA Gist
on:
  schedule:
    # Hourly, so results and live scores reach the gist within the hour. GitHub
    # delays scheduled runs most at the top of the hour, hence the non-zero minute.
    - cron: "17 * * * *"
    # The README preview only needs a daily refresh, so it does not add a commit
    # after every score change.
    - cron: "23 0 * * *"
  workflow_dispatch:
jobs:
  update-gist:
    runs-on: ubuntu-latest
    permissions:
      # Required to push the refreshed README preview branch and merge its PR.
      contents: write
      pull-requests: write
      # Required to dispatch the CI run that supplies the required "lint" check.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to commit the refreshed README preview back to main.
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          # Latest Node 26 release, so setup-node does not need a pinned patch version.
          check-latest: true
      - name: Update gist
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "23 0 * * *" ]; then
            args="--update-readme"
          fi
          node dist/index.js $args
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NBA_TEAM: ${{ secrets.NBA_TEAM }}
      - name: Commit refreshed README preview
        run: |
          if git diff --quiet -- README.md; then
            echo "README preview is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): refresh preview from the live gist"
          # main requires the "lint" status check, so pushing straight from a scheduled
          # run is rejected (GH006). Open a PR instead and queue auto-merge so GitHub
          # merges it as soon as the required checks pass. Requires the repo settings
          # "Read and write" workflow permissions and "Allow GitHub Actions to create
          # and approve pull requests".
          branch="docs/readme-preview-$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --head "$branch" --title "docs(readme): refresh preview from the live gist" \
            --body "Automated refresh of the README preview generated from the live gist."
          # GITHUB_TOKEN-created commits get no pull_request CI run, and the run GitHub
          # queues is held for approval ("action_required"), so the required "lint"
          # check never reports on its own. Dispatch it (explicit dispatches are not
          # held for approval) and wait, so auto-merge can complete unattended.
          gh workflow run ci.yml --ref "$branch"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow=ci.yml --branch "$branch" --event workflow_dispatch \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo "CI run for $branch never appeared"; exit 1; }
          timeout 1800 gh run watch "$run_id" --exit-status
          gh pr merge "$branch" --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
